spring.application.name=config-server
server.port=8888

spring.profiles.active=native
# Absolute path by default so this resolves correctly no matter what working directory the
# JVM is launched from (mvnw from microservices/, an IDE run config, java -jar from anywhere,
# etc.) - a relative "file:../config-repo" only works when launched from this module's own
# directory and fails SILENTLY otherwise (config server just serves an empty property source,
# and every downstream service then fails with "Could not resolve placeholder ..." at startup).
spring.cloud.config.server.native.search-locations=${CONFIG_REPO_PATH:file:C:/Users/2507379/Videos/fundmatrix_backendMicroservice/microservices/config-repo}


eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=false
eureka.instance.prefer-ip-address=true

logging.level.com.fundmatrix=INFO
logging.level.org.springframework.cloud.config=INFO
