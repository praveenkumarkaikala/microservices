# Shared defaults inherited by every microservice client of the config server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
# Register as "localhost" rather than the machine's real LAN IP. This is a single-host dev
# deployment (every service runs on this same machine), and prefer-ip-address=true caused the
# gateway's Reactor Netty client to connect to e.g. 10.187.159.119:8081 instead of
# localhost:8081 - which failed with "Connection prematurely closed BEFORE response" on this
# machine (something blocks/kills self-connections over the real NIC while allowing loopback;
# confirmed by reproducing the same failure with a plain curl to the LAN IP, outside any of our
# code). localhost has no such issue since it's not routed through that interface.
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.lease-renewal-interval-in-seconds=10

spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:fundmatrix}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

server.error.include-message=always

# Shared HMAC signing key so a JWT issued by auth-user-service validates on every other service
fundmatrix.jwt.secret=ZGZramh1cnluaXNkeWl1ZnllODc3OWplaHJ3ZmRncnRlcnRlZ2ZyZXI4NzRld3I4NzRqaDd1NDNoNTdlcjM0dXVpcmV5dGg0M2c1Z2hqcmV0cmVm

fundmatrix.operations.cutoff-time=15:00
fundmatrix.operations.liquid-cutoff-time=13:30
fundmatrix.operations.unit-scale=4
fundmatrix.operations.amount-scale=2
fundmatrix.tax.dividend-tds-rate=10.0
fundmatrix.seed.enabled=${SEED_ENABLED:true}

logging.level.com.fundmatrix=INFO
logging.level.org.hibernate.SQL=WARN
